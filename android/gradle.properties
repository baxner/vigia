# Opciones del proceso Gradle (daemon).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX (obligatorio para proyectos nuevos).
android.useAndroidX=true

# Kotlin genera código Java no-nulo por defecto donde se puede.
kotlin.code.style=official

# Evita que Gradle intente usar configuraciones que no son de este proyecto.
android.nonTransitiveRClass=true
