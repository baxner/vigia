name: Vigia
options:
  bundleIdPrefix: com.baxner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  defaultConfig: Release
  developmentLanguage: es
  knownRegions:
    - en
    - es

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.5.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Vigia:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Vigia
        excludes:
          - "Info.plist"
          - "Vigia.entitlements"
          - "Resources/**"
    resources:
      - path: Vigia/Resources
    entitlements:
      path: Vigia/Vigia.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.baxner.vigia
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baxner.vigia
        PRODUCT_NAME: Vigia
        DISPLAY_NAME: Vigía
        INFOPLIST_FILE: Vigia/Info.plist
        CODE_SIGN_ENTITLEMENTS: Vigia/Vigia.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Frameworks
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    dependencies:
      - target: VigiaWidget
        embed: true
      # Opcional: genera Frameworks/VigiaCore.xcframework con gomobile bind
      # y descomenta la línea siguiente para enlazar el motor Go nativo.
      # - framework: Frameworks/VigiaCore.xcframework
      #   embed: true
      - sdk: CoreBluetooth.framework
      - sdk: CoreLocation.framework
      - sdk: CoreMotion.framework
      - sdk: Network.framework
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: AudioToolbox.framework
      - sdk: BackgroundTasks.framework
      - sdk: UserNotifications.framework
      - sdk: WidgetKit.framework

  VigiaWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VigiaWidget
        excludes:
          - "Info.plist"
          - "VigiaWidget.entitlements"
      - path: Vigia/Bridge/WidgetModels.swift
      - path: Vigia/Bridge/VigiaLocalization.swift
    resources:
      - path: Vigia/Resources/en.lproj
        excludes:
          - "InfoPlist.strings"
      - path: Vigia/Resources/es.lproj
        excludes:
          - "InfoPlist.strings"
    entitlements:
      path: VigiaWidget/VigiaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.baxner.vigia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baxner.vigia.widget
        PRODUCT_NAME: VigiaWidget
        INFOPLIST_FILE: VigiaWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: VigiaWidget/VigiaWidget.entitlements
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  VigiaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VigiaTests
    dependencies:
      - target: Vigia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baxner.vigia.tests
        PRODUCT_NAME: VigiaTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Vigia.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Vigia"
        BUNDLE_LOADER: "$(TEST_HOST)"
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(PROJECT_DIR)/Frameworks

schemes:
  Vigia:
    build:
      targets:
        Vigia: all
        VigiaWidget: all
        VigiaTests: [testing]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VigiaTests
    archive:
      config: Release
